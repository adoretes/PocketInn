name: pocket_inn
description: "PocketInn - A Flutter application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.4+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.0
  flutter_slidable: ^3.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.9.1
  archive: ^4.0.9
  file_picker: ^8.0.0
  image: ^4.5.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Default.json
    - assets/PInn.png
