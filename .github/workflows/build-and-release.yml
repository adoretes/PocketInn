name: Build And Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          pubspec_version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          version="${pubspec_version%%+*}"
          short_sha="${GITHUB_SHA::7}"
          tag_name="${GITHUB_REF#refs/tags/}"
          build_name="${GITHUB_REF#refs/tags/v}"
          build_number="${GITHUB_RUN_NUMBER}"
          release_name="PocketInn ${version} (${short_sha})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_name=${build_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

  build-android:
    runs-on: ubuntu-latest
    needs: prepare-release
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare Android signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64 --build-name="${{ needs.prepare-release.outputs.build_name }}" --build-number="${{ needs.prepare-release.outputs.build_number }}"

      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/PocketInn-${{ needs.prepare-release.outputs.version }}-android-arm64-v8a.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    needs: prepare-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release --build-name="${{ needs.prepare-release.outputs.build_name }}" --build-number="${{ needs.prepare-release.outputs.build_number }}"

      - name: Package Windows build
        shell: pwsh
        run: |
          $assetName = "PocketInn-${{ needs.prepare-release.outputs.version }}-windows.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $assetName -Force
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          Move-Item -LiteralPath $assetName -Destination "release-assets/$assetName" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*

  build-ios:
    runs-on: macos-latest
    needs: prepare-release
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare iOS signing
        id: ios_signing
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' }}
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD:-app-store}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed iOS IPA
        if: ${{ steps.ios_signing.outputs.signed == 'true' }}
        run: flutter build ipa --release --build-name="${{ needs.prepare-release.outputs.build_name }}" --build-number="${{ needs.prepare-release.outputs.build_number }}" --export-options-plist=ios/ExportOptions.plist

      - name: Build iOS app without codesign
        if: ${{ steps.ios_signing.outputs.signed != 'true' }}
        run: flutter build ios --release --no-codesign --build-name="${{ needs.prepare-release.outputs.build_name }}" --build-number="${{ needs.prepare-release.outputs.build_number }}"

      - name: Package signed iOS IPA
        if: ${{ steps.ios_signing.outputs.signed == 'true' }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/ios/ipa/*.ipa "release-assets/PocketInn-${{ needs.prepare-release.outputs.version }}-ios.ipa"

      - name: Package unsigned iOS app
        if: ${{ steps.ios_signing.outputs.signed != 'true' }}
        shell: bash
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "release-assets/PocketInn-${{ needs.prepare-release.outputs.version }}-ios-app.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-assets/*

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-android
      - build-windows
      - build-ios
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/android-release/*
            release-assets/windows-release/*
            release-assets/ios-release/*
